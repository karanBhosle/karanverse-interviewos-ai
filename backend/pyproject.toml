[project]
name = "interviewos-backend"
version = "0.1.0"
description = "InterviewOS AI — personal interview and career intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
  "python-multipart>=0.0.12",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "httpx>=0.27",
  "redis>=5.2",
  "celery>=5.4",
  "langgraph>=0.2",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=2.1",
  "rank-bm25>=0.2.2",
  "slowapi>=0.1.9",
  "email-validator>=2.2",
  "orjson>=3.10",
  "greenlet>=3.1",
  "edge-tts>=7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.27",
  "aiosqlite>=0.20",
]
ocr = ["pytesseract>=0.3.13"]
embeddings = ["sentence-transformers>=3.3"]
faiss = ["faiss-cpu>=1.9"]
mediapipe = ["mediapipe>=0.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
